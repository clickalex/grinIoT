name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allow running the workflow by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a production deploy in flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Smoke tests
        run: |
          pnpm test:smoke
          pnpm test:interact

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: ci/build-pages.sh "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print live URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
